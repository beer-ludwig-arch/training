<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F3F5F1">
<title>Ludwig's Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F6; --card:#FFFFFF; --ink:#15213B; --muted:#67708A; --line:#DDE3EC;
  --primary:#2E58E8; --primary-soft:#E7EDFD; --primary-ink:#1D3FB8;
  --done:#14A077; --done-soft:#DDF4EC; --amber:#F2A516; --flame:#F0642F; --flame-soft:#FFEDE5;
  --display:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --text:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
main{padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 104px);max-width:560px;margin:0 auto}
h1{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px;line-height:1.05}
h2{font-family:var(--display);font-size:18px;font-weight:700;margin:26px 0 10px;letter-spacing:-.01em}
h3{font-family:var(--display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.015em}
.sub{color:var(--muted);margin:0;font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--primary)}

/* header */
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.date{font-size:14px;font-weight:600;color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:5px;background:var(--card);color:var(--flame);font-weight:700;font-size:13px;border-radius:999px;padding:6px 11px;box-shadow:0 0 0 1px var(--line)}
.streak svg{width:15px;height:15px}

/* progress segments */
.segs{display:flex;gap:4px;margin:16px 0 18px}
.segs i{flex:1;height:6px;border-radius:3px;background:#D3DAE5}
.segs i.on{background:var(--done)}
.bar{height:8px;background:#E3E8F0;border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--amber),#F7C548);border-radius:99px;transition:width .4s}

/* cards */
.card{background:var(--card);border-radius:22px;margin:0 0 14px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.pad{padding:18px}
.ex{transition:opacity .28s,transform .28s,max-height .32s,margin .32s;max-height:1000px}
.ex.leaving{opacity:0;transform:scale(.97);max-height:0;margin:0}
.pic{position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.pic.ill{background:#fff;border-bottom:1px solid var(--line)}
.pic.ill img{max-width:84%;max-height:84%;object-fit:contain}
.pic.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic svg.art{width:110px;height:100px}
.pic .step{position:absolute;left:14px;top:12px;color:var(--muted);font-weight:700;font-size:12px;background:var(--paper);border-radius:999px;padding:4px 10px}
.pic.photo .step{background:rgba(255,255,255,.88);color:var(--ink)}
.pic .cam{position:absolute;right:12px;bottom:10px;border:0;background:var(--paper);color:var(--muted);font-size:12px;font-weight:600;border-radius:999px;padding:6px 10px;display:flex;gap:5px;align-items:center}
.pic.photo .cam{background:rgba(255,255,255,.88);color:var(--ink)}
.pic .cam svg{width:14px;height:14px}
.g-cardio{background:linear-gradient(135deg,#FFB877,#F2643A)} .g-legs{background:linear-gradient(135deg,#7FD1BD,#1F6F5C)}
.g-back{background:linear-gradient(135deg,#94B6FF,#3755A3)} .g-push{background:linear-gradient(135deg,#C9A8FF,#6C4FA0)}
.g-core{background:linear-gradient(135deg,#FFD76E,#D99A00)} .g-arms{background:linear-gradient(135deg,#9FD3F5,#2D78B0)}
.goal{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1;margin:12px 0 4px}
.goal small{font-family:var(--text);font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.reps{font-weight:700;font-size:17px;color:var(--ink);margin-bottom:4px}
.first{font-size:13px;background:#FFF6E2;color:#8A5A00;border-radius:12px;padding:9px 11px;margin:10px 0 2px}
.lvl{display:none}
.cue{font-size:15px;color:var(--muted);margin:10px 0 16px}
.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.b{border:0;border-radius:16px;padding:15px 10px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.b svg{width:19px;height:19px}
.b-video{background:var(--primary-soft);color:var(--primary-ink)}
.b-done{background:var(--primary);color:#fff;box-shadow:0 6px 16px -8px rgba(46,88,232,.8)}
.b-done:active,.b-video:active{transform:scale(.98)}
.b-ghost{background:var(--card);color:var(--primary-ink);box-shadow:inset 0 0 0 1.5px #C9D4F6}
.b-full{width:100%}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:600;padding:8px 0;font-size:15px}

/* hero states */
.hero{border-radius:24px;padding:24px 22px;color:#fff;background:linear-gradient(150deg,#2E58E8,#15213B);margin:16px 0 14px}
.hero h2{margin:0 0 8px;font-size:24px;color:#fff;font-weight:800}
.hero p{margin:0;opacity:.9}
.hero.free{background:linear-gradient(150deg,#21B486,#0E6E52)}
.hero.free svg{width:22px;height:22px;vertical-align:-3px}

.donelist{margin-top:6px}
.donelist button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;border-top:1px solid var(--line);padding:12px 2px;text-align:left}
.donelist button:first-child{border-top:0}
.chk{width:22px;height:22px;border-radius:50%;background:var(--done);color:#fff;display:inline-grid;place-items:center;margin-right:10px;flex:none}
.chk svg{width:13px;height:13px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(21,33,59,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet.open{opacity:1;pointer-events:auto}
.sheet-card{background:#fff;width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(30px);transition:transform .25s;max-height:90vh;overflow:auto}
#sheet.open .sheet-card{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.lab{font-weight:700;margin:20px 0 8px;font-size:15px}
.wsel{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.wsel button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 4px;font-weight:700;font-size:14px}
.wsel button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink)}
.stepper{display:grid;grid-template-columns:62px 48px 1fr 48px;align-items:center;gap:8px;margin:8px 0}
.stepper label{font-weight:600;font-size:15px;color:var(--muted)}
.stepper button{height:46px;border-radius:14px;border:0;background:var(--paper);font-size:22px;font-weight:600;color:var(--ink)}
.stepper input{height:46px;border-radius:14px;border:1.5px solid var(--line);text-align:center;font-family:var(--display);font-size:19px;font-weight:700;width:100%;background:#fff;-webkit-appearance:none;appearance:none}

/* progress page */
.lvcard{background:linear-gradient(155deg,#1F2F57,#15213B);color:#fff;margin-top:16px}
.lvtop{display:flex;align-items:center;gap:14px}
.lvbadge{width:56px;height:56px;border-radius:18px;background:linear-gradient(140deg,#F7C548,#F2A516);color:#15213B;font-family:var(--display);font-size:26px;font-weight:800;display:grid;place-items:center;flex:none}
.lvname{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em}
.lvcard .muted{color:#AEB8D3}
.pts{font-family:var(--display);font-size:22px;font-weight:800;color:#F7C548}
.pts span{font-size:13px;font-weight:600;color:#AEB8D3}
.lvcard .bar{background:rgba(255,255,255,.14)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mini{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:16px;padding:11px 12px}
.mini svg{width:24px;height:24px;color:#FF8A57;flex:none}
.mini b{display:block;font-family:var(--display);font-size:17px}
.mini span{font-size:12px;color:#AEB8D3}
.mini-s svg{color:#7FA1FF}
.cheer{margin:16px 0 0;font-weight:700;color:#fff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.wd i{display:grid;place-items:center;margin:6px auto 0;width:38px;height:38px;border-radius:50%;font-style:normal;font-family:var(--display);font-weight:700;font-size:14px;background:var(--paper);color:var(--muted)}
.wd i.done{background:var(--done);color:#fff}
.wd i.plan{background:var(--primary-soft);color:var(--primary-ink)}
.wd i.free{background:var(--done-soft);color:var(--done)}
.wd i.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 0 var(--line)}
.stat b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.up{color:var(--done);font-weight:800}
.toggles{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.toggles button{border:0;background:var(--paper);border-radius:12px;padding:11px 0;font-weight:700;font-size:13px}
.toggles button.on{background:var(--ink);color:#fff}
details.set summary{list-style:none;font-family:var(--display);font-weight:700;padding:18px;display:flex;justify-content:space-between;cursor:pointer}
details.set summary::-webkit-details-marker{display:none}
details.set[open] summary .chev{transform:rotate(90deg)}
.chev{transition:transform .2s;color:var(--muted)}

/* tabs, party, toast */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#98A0B5;padding:6px 0}
#tabs svg{width:24px;height:24px}
#tabs button.on{color:var(--primary)}
#party{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,#2E58E8,#15213B 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;opacity:0;pointer-events:none;transition:opacity .3s}
#party.open{opacity:1;pointer-events:auto}
#party .ring{width:112px;height:112px;border-radius:50%;background:var(--done);display:grid;place-items:center;margin-bottom:24px;animation:pop .55s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 12px rgba(20,160,119,.25)}
#party .ring svg{width:54px;height:54px}
#party h1{color:#fff;font-size:34px;margin:0 0 10px}
#party p{opacity:.9;max-width:320px;margin:0 0 6px;font-size:17px}
#party .facts{display:flex;gap:8px;margin:24px 0 30px;flex-wrap:wrap;justify-content:center}
#party .facts span{background:rgba(255,255,255,.12);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
#party button{border:0;background:#fff;color:var(--ink);font-weight:800;border-radius:16px;padding:15px 44px;font-size:16px}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%) translateY(10px);opacity:0;transition:all .25s;z-index:20;background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#timer{display:none!important}
#sync{font-size:12px;color:#98A0B5;text-align:center;margin-top:26px}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

  --display:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

  main{padding-left:15px;padding-right:15px}
  .pad{padding:17px}
  .stats{gap:6px}
  .stat{padding:13px 9px}
  .stat b{font-size:21px}

}

/* elevated editorial finish */
:root{
  --paper:#F4F1EA; --card:#FFFEFC; --ink:#1D3026; --muted:#778078; --line:#E8E3D9;
  --primary:#285744; --primary-soft:#E9F0EA; --primary-ink:#285744;
  --done:#3D7758; --done-soft:#E7F0E8; --amber:#C99A54; --flame:#A96D46; --flame-soft:#F7EEE5;
}
html,body{background:radial-gradient(ellipse at 50% -18%,#FCFBF7 0%,#F4F1EA 70%);background-attachment:fixed}
main{max-width:580px;padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 132px)}
h1{font-size:clamp(32px,7vw,38px);font-weight:700;letter-spacing:-.055em;line-height:1.08;margin:10px 0 7px}
h2,h3{font-family:var(--text);font-weight:700;letter-spacing:-.035em}
h3{font-size:21px}
.sub{font-size:15px;color:#7B817A}
.date{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#788077}
.streak{padding:8px 13px;border:1px solid #E8DFD1;background:#FBF6EE;color:#9A6842;box-shadow:none;font-size:12px;letter-spacing:.01em}
.streak svg{color:#B8794D}
.segs{gap:5px;margin:20px 0 22px}
.segs i{height:5px;border-radius:99px;background:#E5E4DD}
.segs i.on{background:#699175}
.card{border:1px solid rgba(57,65,52,.07);border-radius:28px;margin-bottom:18px;background:var(--card);box-shadow:0 14px 36px rgba(42,49,39,.065),0 2px 6px rgba(42,49,39,.025)}
.pad{padding:22px 23px 23px}
.pic{height:205px;aspect-ratio:auto;width:calc(100% - 20px);margin:10px 10px 0;border:1px solid #ECEAE4;border-radius:20px;color:var(--ink);background:#fff}
.pic.ill,.pic.g-cardio,.pic.g-legs,.pic.g-back,.pic.g-push,.pic.g-core,.pic.g-arms{background:#fff;border-bottom:0}
.pic svg.art{width:128px;height:116px;color:#202B24;stroke:#202B24}
.pic .step{left:12px;top:12px;padding:6px 10px;background:#F3F1EB;color:#666E66;font-size:11px;font-weight:700;letter-spacing:.04em}
.pic .cam{right:11px;bottom:11px;min-height:42px;padding:9px 13px;background:#F4F2EC;color:#47554B;font-size:12px;font-weight:700;border-radius:999px}
.pic.photo .cam{background:rgba(255,254,252,.94);color:var(--ink)}
.goal{font-size:36px;font-weight:700;letter-spacing:-.055em;margin:11px 0 5px}
.goal small{font-size:14px;color:#778078}
.reps{font-size:15px;font-weight:600;color:#4F5C52}
.first{background:#F8F2E8;color:#806442;border:1px solid #EFE4D2;border-radius:14px;padding:11px 13px;font-size:13px}
.cue{font-size:14px;line-height:1.6;color:#69736B;margin:10px 0 18px}
.actions{grid-template-columns:.82fr 1.18fr;gap:10px}
.b{min-height:56px;border-radius:17px;padding:14px 12px;font-size:14px;font-weight:700;letter-spacing:.015em;transition:transform .16s ease,background-color .16s ease,box-shadow .16s ease}
.b-video{background:#F1F2EC;color:#536157}
.b-done{background:linear-gradient(135deg,#32664B,#244B38);box-shadow:0 9px 18px -12px rgba(35,75,54,.75)}
.b-done:active{transform:scale(.985);box-shadow:0 4px 10px -8px rgba(35,75,54,.75)}
.b-ghost{color:#355B43;box-shadow:inset 0 0 0 1px #C9D8CB}
.linkbtn{color:#37674C}
.hero{border-radius:26px;padding:26px 24px;background:linear-gradient(145deg,#35654B,#223E2D);box-shadow:0 16px 34px rgba(35,62,45,.14)}
.hero.free{background:linear-gradient(145deg,#718A70,#526A51)}
#sheet{background:rgba(25,39,30,.42);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.sheet-card{border-radius:30px 30px 0 0;box-shadow:0 -18px 48px rgba(33,47,37,.15)}
.wsel button.on{border-color:#91AE98;background:#EFF4EF;color:#315941}
.stepper button{background:#F2F1EC}
.stepper input{border-color:#E7E5DD}
.lvcard{background:linear-gradient(145deg,#263D30,#1B2D23);box-shadow:0 16px 34px rgba(30,50,37,.15)}
.lvbadge{background:#D9B778;color:#26382B}
.pts{color:#E3C78F}
.pts span{color:#BAC5B9}
.lvcard .bar>div{background:linear-gradient(90deg,#9FB99E,#DEC68F)}
.wd i.today{box-shadow:0 0 0 2px #fff,0 0 0 4px #6A8A6C}
.stat{border:1px solid rgba(57,65,52,.065);box-shadow:0 8px 22px rgba(42,49,39,.045)}
#tabs{left:50%;right:auto;bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(286px,calc(100% - 36px));transform:translateX(-50%);border:1px solid rgba(255,255,255,.88);border-radius:22px;padding:6px;background:rgba(255,254,252,.94);box-shadow:0 12px 34px rgba(40,48,39,.14)}
#tabs button{min-height:54px;border-radius:16px;gap:3px;padding:6px 0;color:#8B938A;font-size:11px}
#tabs button.on{background:#EDF2EC;color:#315D43}
#tabs svg{width:22px;height:22px}
#party{background:linear-gradient(155deg,#35664B,#1D3425 76%)}
#party .ring{background:#4B8060;box-shadow:0 0 0 12px rgba(120,157,123,.2)}
#party button{min-height:56px;border-radius:17px}
#toast{background:#21392B;border-radius:16px;box-shadow:0 12px 30px rgba(25,39,30,.2)}
#sync{color:#92988F;font-size:11px}
:focus-visible{outline-color:#8BA994}
@media(max-width:480px){
  main{padding-left:16px;padding-right:16px}
  .pic{height:190px}
  .pad{padding:20px 19px 21px}
  .actions{grid-template-columns:.84fr 1.16fr}
  #tabs{bottom:calc(env(safe-area-inset-bottom) + 9px)}
}
@media(max-width:360px){
  .pic{height:176px}
  h1{font-size:31px}
  .pad{padding-left:17px;padding-right:17px}
}

/* final touches */
:root{--display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif}
html,body,button,input{font-family:var(--text)}
h1,h2,h3,.goal,.lvname,.pts,.lvbadge,.mini b,.stat b,.wd i,.stepper input{font-family:var(--display)}
h1{font-weight:800;letter-spacing:-.035em}
.goal{font-weight:800;letter-spacing:-.04em}
.head{text-align:center;margin-bottom:4px}
.head.left{text-align:left}
.head .date{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#788077;margin-top:6px}
.gap{height:18px}
.switch{text-align:center;margin:26px 0 0}
.switch p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.switch div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.switch button{border:1px solid var(--line);background:var(--card);color:var(--primary-ink);font-weight:700;font-size:14px;border-radius:999px;padding:11px 18px;min-height:44px}
.donehead h1{color:var(--done)}
.credit{font-size:10px;color:#A3ABA4;text-align:center;margin:14px 0 0}
.credit a{color:inherit}
.bk{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBF6EE;border:1px solid #EFE4D2;border-radius:16px;padding:10px 12px 10px 14px;margin:0 0 14px;font-size:13px;font-weight:600;color:#806442}
.bk button{border:0;background:var(--primary);color:#fff;font-weight:700;font-size:13px;border-radius:12px;padding:9px 12px;white-space:nowrap}
</style>

/* ---------- state & storage ---------- */
const S = {sessions:{}, settings:{aDay:1, bDay:4, days:[1,4], start:"2026-11-02"}, posture:{days:{}}, photos:{}, body:{waist:{}}, later:{}, override:{}, tab:"today", loaded:false, mode:"loading", showDone:false};
const LS = "lb-training-v2";
let db = null, dl = null;
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify({sessions:S.sessions, settings:S.settings, posture:S.posture, photos:S.photos, body:S.body})); } catch(e){} }
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } }
let syncText = "";

const timers = {}, inflight = {}, dirty = {};
function queueSave(path, get, delay){

async function put(path, data){ if (data === null) await db.doc(path).delete(); else await db.doc(path).set(data); }
async function flush(path, get){

  try {
    try { await put(path, get()); }
    catch(e){ if (e && e.code === "unavailable") { await sleep(700 + Math.random()*800); await put(path, get()); } else throw e; }
    setSync("Saved to your Claude account");
  } catch(e){ setSync(e && e.code === "quota_exceeded" ? "Storage full, not saved" : "Not saved, check your connection"); }
  const again = inflight[path] === "again"; inflight[path] = false;
  if (again) return flush(path, get);

}
const saveSession = d => queueSave("sessions/"+d, () => S.sessions[d] ? clone(S.sessions[d]) : null);

function migrate(s){
  if (s && s.sets && !s.log) {
    s.log = {};
    Object.keys(s.sets).forEach(k => {
      const rows = (s.sets[k] || []).filter(x => x && x.r);
      if (rows.length) s.log[k] = {w: rows[0].w ? Number(rows[0].w) : null, reps: rows.map(x => Number(x.r))};
    });
  }
  if (s && !s.log) s.log = {};
  return s;
}

async function init(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

  try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(x => { dl = x; if (S.tab === "progress") render(); }).catch(() => {}); } catch(e){}
  if (!ns) {
    S.mode = "local"; const d = lsLoad();
    if (d.sessions) { S.sessions = d.sessions; Object.values(S.sessions).forEach(migrate); }
    if (d.settings) S.settings = Object.assign(S.settings, d.settings);
    if (d.posture) S.posture = d.posture;
    if (d.photos) S.photos = d.photos;
    if (d.body) S.body = d.body;
    fixSettings(); S.loaded = true; setSync("Saved on this device only"); render(); return;
  }
  db = ns; S.mode = "cloud";
  try {
    const r = await Promise.all([db.doc("settings/main").get(), db.doc("posture/log").get(), db.collection("photos").get(), db.doc("body/log").get()]);
    if (r[0].exists) S.settings = Object.assign({}, S.settings, clone(r[0].data()));
    if (r[1].exists) S.posture = {days: clone(r[1].data()).days || {}};
    if (r[3].exists) S.body = {waist: clone(r[3].data()).waist || {}};
    r[2].docs.forEach(d => { if (d.exists && d.data().img) S.photos[d.id] = d.data().img; });
  } catch(e){}
  fixSettings();
  let first = true;
  const fb = setTimeout(() => { if (!S.loaded) { S.loaded = true; render(); } }, 8000);
  db.collection("sessions").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = migrate(clone(d.data())); });
    Object.keys(dirty).forEach(p => { if (p.indexOf("sessions/") === 0) { const id = p.slice(9); if (S.sessions[id]) next[id] = S.sessions[id]; else delete next[id]; } });
    S.sessions = next;
    if (first) { first = false; clearTimeout(fb); S.loaded = true; setSync("Synced with your Claude account"); render(); return; }
    if (!$("#sheet").classList.contains("open") && !busy) render();
  }, () => setSync("Sync paused, reload the page"));
}

/* ---------- plan logic ---------- */
const isGym = t => t === "A" || t === "B";
function weekNo(d){ const x = diff(S.settings.start, d); return x < 0 ? 0 : Math.floor(x/7)+1; }
function fixSettings(){ const st = S.settings; if (typeof st.aDay !== "number") { const ds = (st.days || []).filter(x => x !== 0); st.aDay = ds[0] || 1; st.bDay = ds[1] || (st.aDay === 4 ? 1 : 4); } st.days = [st.aDay, st.bDay]; }
function plannedKind(d){ const w = parse(d).getDay(); if (w === 0) return "free"; if (w === S.settings.aDay) return "A"; if (w === S.settings.bDay) return "B"; return "rest"; }
function isPlanned(d){ const k = plannedKind(d); return k === "A" || k === "B"; }
function nextGym(before){
  const ds = Object.keys(S.sessions).filter(d => d < before && S.sessions[d].done && isGym(S.sessions[d].type)).sort();
  return !ds.length ? "A" : (S.sessions[ds[ds.length-1]].type === "A" ? "B" : "A");
}
function typeFor(d){ const s = S.sessions[d]; if (s && s.type) return s.type; if (S.override[d]) return S.override[d]; return plannedKind(d); }
function setsFor(id, d){ return EX[id].kind === "min" ? 1 : 3; }
function lastLog(id, before){
  const ds = Object.keys(S.sessions).filter(d => d < before && S.sessions[d].log && S.sessions[d].log[id] && !S.sessions[d].log[id].skipped && (S.sessions[d].log[id].reps || []).length).sort();
  return ds.length ? {date:ds[ds.length-1], ...S.sessions[ds[ds.length-1]].log[id]} : null;
}
function goal(id, d){
  const ex = EX[id];
  if (ex.kind === "min") { const l = lastLog(id, d); return {min: ex.min, text: ex.min+" min"}; }
  const n = setsFor(id, d), lo = ex.reps[0], hi = ex.reps[1], l = lastLog(id, d);
  let reps = [], w = null, up = false, first = false;
  if (ex.kind === "weight") {
    if (!l || l.w == null) { w = ex.start; first = true; for (let i = 0; i < n; i++) reps.push(lo); }
    else if (l.reps.length >= Math.min(n,2) && l.reps.every(r => r >= hi)) { w = l.w + ex.step; up = true; for (let i = 0; i < n; i++) reps.push(lo); }
    else { w = l.w; for (let i = 0; i < n; i++) reps.push(l.reps[i] != null ? Math.min(hi, l.reps[i]+1) : lo); }
  } else {
    const stepv = ex.kind === "time" ? 5 : 1;
    for (let i = 0; i < n; i++) {
      const last = l && l.reps[i] != null ? l.reps[i] : null;
      reps.push(last == null ? lo : (last >= hi ? last + stepv : Math.min(hi, last + stepv)));
    }
    up = !!(l && l.reps.every(r => r >= hi));
  }
  const unit = ex.kind === "time" ? " s" : " reps";
  const same = reps.every(r => r === reps[0]);
  const rtxt = same ? n+" × "+reps[0]+unit : reps.join(" · ")+unit;
  return {reps, w, up, n, first, text: rtxt + (ex.unit ? " "+ex.unit : ""), wtxt: ex.kind === "weight" ? nice(w)+" kg"+(ex.per ? " "+ex.per : "") : ""};
}
function itemsFor(t){ return t === "free" ? [] : t === "rest" ? POSTURE.map(p => p.id) : WORKOUTS[t].list; }
function doneFor(d, t){
  if (t === "rest") return (S.posture.days[d] || []).map(i => "pos"+i);
  const s = S.sessions[d]; return s && s.log ? Object.keys(s.log) : [];
}
function sessCount(from, to){ let n = 0; Object.keys(S.sessions).forEach(d => { if (d >= from && d <= to && S.sessions[d].done) n++; }); return n; }
function weekDone(d){ const m = monday(d); return sessCount(m, addDays(m, 6)); }
function target(){ return 2; }
function streak(){
  const t = today(); let m = monday(t), n = 0;
  if (weekDone(m) >= 2) n++;
  m = addDays(m, -7);
  while (weekDone(m) >= 2) { n++; m = addDays(m, -7); }
  return n;
}
function bestStreak(){
  const ds = Object.keys(S.sessions).filter(d => S.sessions[d].done).sort(); if (!ds.length) return 0;
  let m = monday(ds[0]), end = monday(today()), run = 0, best = 0;
  while (m <= end) { if (weekDone(m) >= 2) { run++; best = Math.max(best, run); } else if (m !== end) run = 0; m = addDays(m, 7); }
  return best;
}
function upcoming(from, k){
  const out = []; let d = from;
  for (let i = 0; i < 21 && out.length < k; i++) { if (isPlanned(d) && !(S.sessions[d] && S.sessions[d].done)) out.push(d); d = addDays(d, 1); }
  return out;
}
const LEVELS = [["Starter",0],["Regular",300],["Committed",800],["Strong Back",1600],["Athlete",2800],["Beast",4500],["Legend",7000]];
function posDone(d){ return (S.posture.days[d] || []).length >= POSTURE.length; }
function points(){
  let p = 0; const weeks = {};
  Object.keys(S.sessions).forEach(d => { const s = S.sessions[d]; if (s.done && isGym(s.type)) { p += 100; Object.values(s.log || {}).forEach(l => { if (l && l.more) p += 10; }); (weeks[monday(d)] = weeks[monday(d)] || {g:0,p:0}).g++; } });
  Object.keys(S.posture.days).forEach(d => { if (posDone(d)) { p += 25; (weeks[monday(d)] = weeks[monday(d)] || {g:0,p:0}).p++; } });
  Object.values(weeks).forEach(w => { if (w.g >= 2 && w.p >= 4) p += 50; });
  return p;
}
function levelOf(p){ let i = 0; while (i+1 < LEVELS.length && p >= LEVELS[i+1][1]) i++; return i; }
function strengthPct(){
  const vals = [];
  Object.keys(EX).forEach(id => {
    if (EX[id].kind !== "weight") return;
    const ds = Object.keys(S.sessions).filter(x => { const l = S.sessions[x].log && S.sessions[x].log[id]; return l && !l.skipped && l.w > 0; }).sort();
    if (ds.length < 2) return;
    vals.push(S.sessions[ds[ds.length-1]].log[id].w / S.sessions[ds[0]].log[id].w - 1);
  });
  return vals.length ? Math.max(0, Math.round(vals.reduce((a,b) => a+b, 0) / vals.length * 100)) : null;
}
function activeDay(d){ const s = S.sessions[d]; return !!(s && s.done) || posDone(d); }
function dayStreak(){
  let d = today(), n = 0;
  if (!activeDay(d)) d = addDays(d, -1);

}
function relDay(d){ const x = diff(today(), d); return x === 0 ? "today" : x === 1 ? "tomorrow" : "in "+x+" days"; }
function plannedType(d){

    const tt = (x === t && st && isGym(st.type)) ? st.type : nx;
    if (x === d) return tt;
    nx = tt === "A" ? "B" : "A";
  }
  return nx;
}

  });
  h += '<p style="margin:16px 0 0"><a href="'+PLAN_DOC+'" target="_blank" rel="noopener">Open the full training plan ›</a></p>'+
       '<div style="margin-top:18px">'+'<button class="b b-ghost b-full" data-act="backup">Save backup file</button>'+
       '<div style="text-align:center"><button class="linkbtn" data-act="restore">Restore from backup file</button></div></div>'+
       '<p class="credit">Drawings: <a href="https://github.com/everkinetic/data" target="_blank" rel="noopener">Everkinetic</a>, CC BY-SA 4.0, resized</p></div></details>';
  return h;
}

/* ---------- sheet ---------- */
let sheetId = null, sheetVals = null;
function openSheet(id){
  const d = today(), ex = EX[id], g = goal(id, d);
  sheetId = id;
  const unit = ex.kind === "time" ? "s" : "reps";
  let h = '<div class="grab"></div><h3>'+esc(ex.name)+'</h3>';
  if (ex.kind === "weight") {
    const lessW = Math.max(0, g.w - ex.step), moreW = g.w + ex.step;
    h += '<p class="lab">Weight</p><div class="wsel">'+
      '<button data-act="wsel" data-w="'+lessW+'"><b>Less</b></button>'+
      '<button data-act="wsel" data-w="'+g.w+'" class="on"><b>As suggested</b></button>'+
      '<button data-act="wsel" data-w="'+moreW+'"><b>More</b></button></div>'+
      '<input type="hidden" data-k="w" value="'+g.w+'">';
  }
  h += '<p class="lab">'+(ex.kind === "time" ? "Seconds" : "Reps")+' per set'+(ex.unit ? " ("+ex.unit+")" : "")+'</p>';
  g.reps.forEach((r, i) => { h += stepper("Set "+(i+1), "r"+i, r, unit); });
  h += '<button class="b b-done b-full" data-act="save" style="margin-top:16px">'+I.check+'Save</button>'+
       '';
  $("#sheetCard").innerHTML = h;
  $("#sheet").classList.add("open");
}
function openWaist(){
  sheetId = "__waist";
  const ks = Object.keys(S.body.waist || {}).sort(), last = ks.length ? S.body.waist[ks[ks.length-1]] : 80;
  $("#sheetCard").innerHTML = '<div class="grab"></div><h3>Waist</h3><p class="muted" style="margin:4px 0 12px">Measure at belly button height, in the morning, relaxed.</p>'+
    stepper("Waist", "waist", last, "cm")+'<button class="b b-done b-full" data-act="waist-save" style="margin-top:16px">'+I.check+'Save</button>';
  $("#sheet").classList.add("open");
}
function stepper(label, key, val, unit){
  return '<div class="stepper"><label>'+label+'</label><button data-act="dec" data-k="'+key+'">−</button><input data-k="'+key+'" inputmode="decimal" value="'+esc(val)+'" placeholder="'+(unit || "")+'"><button data-act="inc" data-k="'+key+'">+</button></div>';
}
function closeSheet(){ $("#sheet").classList.remove("open"); sheetId = null; }
function readSheet(){
  const ex = EX[sheetId], out = {};
  const val = k => { const el = $('#sheetCard input[data-k="'+k+'"]'); const v = el ? parseFloat(String(el.value).replace(",", ".")) : NaN; return isNaN(v) ? null : v; };
  if (ex.kind === "weight") out.w = val("w");
  out.reps = []; for (let i = 0; i < 10; i++) { if (!$('#sheetCard input[data-k="r'+i+'"]')) break; const v = val("r"+i); if (v != null) out.reps.push(v); }
  return out;
}
function logItem(id, entry){
  const d = today(); let s = S.sessions[d];
  if (!s) s = S.sessions[d] = {date:d, type:typeFor(d), log:{}, done:false};
  if (!s.type || s.type === "rest") s.type = typeFor(d);
  s.log = s.log || {}; s.log[id] = entry; s.updatedAt = new Date().toISOString();
  const list = WORKOUTS[s.type] ? WORKOUTS[s.type].list : [];
  const finished = list.length && list.every(x => s.log[x]);
  if (finished) { s.done = true; s.doneAt = new Date().toISOString(); }
  saveSession(d);
  return finished;
}
function removeCard(id, after){
  const el = document.querySelector('[data-card="'+id+'"]');
  busy = true;
  if (el) { el.style.maxHeight = el.offsetHeight+"px"; requestAnimationFrame(() => el.classList.add("leaving")); }
  setTimeout(() => { busy = false; after(); }, el ? 340 : 0);
}
function complete(id, entry, skipped){
  const d = today();
  stopTimer();
  const fin = logItem(id, entry);
  const left = itemsFor(typeFor(d)).filter(x => doneFor(d, typeFor(d)).indexOf(x) < 0).length;
  removeCard(id, () => { render(); if (fin) celebrate(); else toast(skipped ? "Skipped. "+left+" left." : "Nice! "+left+" to go."); });
}
function celebrate(){
  const d = today(), s = S.sessions[d], st = streak(), wk = weekDone(d), nx = upcoming(addDays(d,1), 1)[0];
  const sum = a => (a || []).reduce((x, y) => x + Number(y || 0), 0);
  const ups = s && WORKOUTS[s.type] ? WORKOUTS[s.type].list.filter(id => {
    const ex = EX[id], l = s.log[id]; if (ex.kind === "min" || !l || l.skipped) return false;
    const g = goal(id, d);
    return (ex.kind === "weight" && l.w > g.w) || ((ex.kind !== "weight" || l.w === g.w) && sum(l.reps) > sum(g.reps));
  }).slice(0, 2).map(id => EX[id].name) : [];
  const ptsNow = points(), earned = 100 + Object.values((s && s.log) || {}).filter(l => l && l.more).length * 10, lvNow = levelOf(ptsNow), lvUp = lvNow > levelOf(ptsNow - earned);
  const p = $("#party");
  p.innerHTML = '<div class="ring">'+I.check+'</div><h1>Great job, Ludwig!</h1>'+(lvUp ? '<p style="font-size:20px;font-weight:800;margin-bottom:10px">New level: '+LEVELS[lvNow][0]+'!</p>' : "")+
    (ups.length ? '<p style="margin-top:14px">You did especially great on '+esc(ups.join(" and "))+'.</p>' : "")+
    '<div class="facts"><span>🏅 +'+earned+' points</span><span>🔥 '+dayStreak()+'-day streak</span></div><button data-act="party-close">Close</button>';
  p.classList.add("open");
}
let tEnd = 0, tInt = null, tHide = null;
function startTimer(sec){ tEnd = Date.now() + sec*1000; clearInterval(tInt); clearTimeout(tHide); const el = $("#timer"); el.hidden = false; el.classList.remove("over"); $("#tlbl").textContent = "Rest, then next set"; tTick(); tInt = setInterval(tTick, 250); }
function tTick(){ const left = Math.max(0, Math.round((tEnd - Date.now())/1000)); $("#tval").textContent = Math.floor(left/60)+":"+pad(left%60); if (left <= 0) { clearInterval(tInt); $("#timer").classList.add("over"); $("#tlbl").textContent = "Rest over. Next set!"; tHide = setTimeout(() => { $("#timer").hidden = true; }, 6000); } }
function stopTimer(){ clearInterval(tInt); clearTimeout(tHide); $("#timer").hidden = true; }
let toastT;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1900); }

/* ---------- photos ---------- */
let photoFor = null;
function handlePhoto(file){
  if (!file || !photoFor) return;
  const id = photoFor, url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const W = 800, H = 400, c = document.createElement("canvas"); c.width = W; c.height = H;
    const sc = Math.max(W/img.width, H/img.height), w = img.width*sc, h = img.height*sc;
    c.getContext("2d").drawImage(img, (W-w)/2, (H-h)/2, w, h);
    let q = 0.75, data = c.toDataURL("image/jpeg", q);
    while (data.length > 180000 && q > 0.35) { q -= 0.1; data = c.toDataURL("image/jpeg", q); }
    URL.revokeObjectURL(url);
    S.photos[id] = data; savePhoto(id); render(); toast("Photo saved");
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Could not read that photo"); };
  img.src = url;
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("#tabs button");
  if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target === $("#sheet")) { closeSheet(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, d = today();
  if (act === "open") {
    const ex = EX[b.dataset.id];
    if (ex.kind === "min") { complete(b.dataset.id, {min: ex.min}, false); return; }
    openSheet(b.dataset.id); return;
  }
  if (act === "inc" || act === "dec") {
    const k = b.dataset.k, el = $('#sheetCard input[data-k="'+k+'"]'), ex = EX[sheetId];
    const stepv = k === "waist" ? 0.5 : k === "w" ? ex.step : (ex.kind === "time" ? 5 : 1);
    let v = parseFloat(String(el.value).replace(",", ".")); if (isNaN(v)) v = 0;
    v = Math.max(0, v + (act === "inc" ? stepv : -stepv)); el.value = nice(v);
    if (k === "w") document.querySelectorAll(".wsel button").forEach(x => x.classList.remove("on"));
    return;
  }
  if (act === "wsel") {
    document.querySelectorAll(".wsel button").forEach(x => x.classList.toggle("on", x === b));
    const el = $('#sheetCard input[data-k="w"]'); if (el) el.value = nice(Number(b.dataset.w)); return;
  }
  if (act === "otherw") { const o = $("#otherw"); if (o) o.hidden = false; b.style.display = "none"; return; }
  if (act === "save" || act === "skip") {
    const id = sheetId, ex = EX[id];
    let entry;
    if (act === "skip") entry = {skipped:true};
    else { entry = readSheet(); if (ex.kind === "weight" && entry.w == null) { toast("Enter the weight you used"); return; } if (!entry.reps.length) { toast("Enter your reps"); return; } if (ex.kind === "weight" && entry.w > goal(id, d).w) entry.more = true; }
    closeSheet(); complete(id, entry, act === "skip"); return;
  }
  if (act === "later") {
    const id = b.dataset.id, a = (S.later[d] || []).filter(x => x !== id); a.push(id); S.later[d] = a;
    removeCard(id, () => { render(); toast(EX[id].name+" moved to the end"); }); return;
  }
  if (act === "timer") { startTimer(Number(b.dataset.sec)); return; }
  if (act === "t-add") { tEnd += 15000; if ($("#timer").classList.contains("over")) startTimer(15); else tTick(); return; }
  if (act === "t-skip") { stopTimer(); return; }
  if (act === "waist") { openWaist(); return; }
  if (act === "waist-save") {
    const el = $('#sheetCard input[data-k="waist"]'), v = el ? parseFloat(String(el.value).replace(",", ".")) : NaN;
    if (isNaN(v) || v < 40 || v > 200) { toast("Enter your waist in cm"); return; }
    S.body.waist = S.body.waist || {}; S.body.waist[d] = v; saveBody(); closeSheet(); render(); toast("Waist saved"); return;
  }
  if (act === "pos-done") {
    const id = b.dataset.id, i = Number(id.slice(3)), arr = (S.posture.days[d] || []).slice();
    if (arr.indexOf(i) < 0) arr.push(i); S.posture.days[d] = arr; savePosture();
    removeCard(id, () => { render(); toast(arr.length >= POSTURE.length ? "Posture routine done. +25 points!" : (POSTURE.length - arr.length)+" to go"); });
    return;
  }
  if (act === "undo") {
    const id = b.dataset.id;
    if (id.indexOf("pos") === 0) { const i = Number(id.slice(3)); S.posture.days[d] = (S.posture.days[d] || []).filter(x => x !== i); savePosture(); }
    else { const s = S.sessions[d]; if (s && s.log) { delete s.log[id]; s.done = false; s.updatedAt = new Date().toISOString(); if (!Object.keys(s.log).length) delete S.sessions[d]; saveSession(d); } }
    render(); return;
  }
  if (act === "toggle-done") { S.showDone = !S.showDone; render(); return; }
  if (act === "finish") { const s = S.sessions[d]; if (s) { s.done = true; s.doneAt = new Date().toISOString(); saveSession(d); render(); celebrate(); } return; }
  if (act === "reopen") { const s = S.sessions[d]; if (s) { s.done = false; saveSession(d); S.showDone = true; render(); } return; }
  if (act === "type") {
    const v = b.dataset.v, s = S.sessions[d];
    S.showPosture = v === "rest";
    if (v !== "rest") { if (s && !s.done) { s.type = v; s.updatedAt = new Date().toISOString(); saveSession(d); } else if (!s) S.override[d] = v; }
    render(); window.scrollTo(0,0); return;
  }
  if (act === "party-close") { $("#party").classList.remove("open"); render(); window.scrollTo(0,0); return; }
  if (act === "photo") { photoFor = b.dataset.id; $("#photoInput").value = ""; $("#photoInput").click(); return; }
  if (act === "abday") { const k = b.dataset.k, v = Number(b.dataset.v), o = k === "aDay" ? "bDay" : "aDay"; if (S.settings[o] === v) { toast("That day already has the other workout"); return; } S.settings[k] = v; S.settings.days = [S.settings.aDay, S.settings.bDay]; saveSettings(); render(); keepSettingsOpen(); return; }
  if (act === "dayset") { const v = Number(b.dataset.v), a = S.settings.days.slice(), k = a.indexOf(v); if (k >= 0) a.splice(k,1); else a.push(v); S.settings.days = a.sort(); saveSettings(); render(); keepSettingsOpen(); return; }
  if (act === "backup") { doBackup(); return; }
  if (act === "restore") { $("#restoreInput").value = ""; $("#restoreInput").click(); return; }
});
async function doBackup(){
  const d = today(), name = "training-backup-"+d+".json";
  const data = JSON.stringify({version:2, exported:new Date().toISOString(), sessions:S.sessions, settings:S.settings, posture:S.posture, body:S.body}, null, 1);
  const done = () => { S.settings.lastBackup = d; saveSettings(); toast("Backup saved"); render(); };
  try {
    if (dl) { await dl.save({filename:name, data}); done(); return; }
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Training backup"}); done(); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); done();
  } catch(err){ if (!err || (err.name !== "AbortError" && err.code !== "declined")) toast("Backup didn't work, try again"); }
}
function backupDue(){
  const has = Object.keys(S.sessions).length || Object.keys(S.posture.days).length;
  if (!has) return false;
  const last = S.settings.lastBackup;
  if (last) return diff(last, today()) >= 7;
  const first = Object.keys(S.sessions).concat(Object.keys(S.posture.days)).sort()[0];
  return diff(first, today()) >= 7;
}
function keepSettingsOpen(){ const el = document.querySelector("details.set"); if (el) el.open = true; }
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "photoInput") { handlePhoto(t.files && t.files[0]); return; }
  if (t.id === "restoreInput") {
    const f = t.files && t.files[0]; if (!f) return;
    f.text().then(async txt => {
      let data; try { data = JSON.parse(txt); } catch(err){ toast("That file is not a backup"); return; }
      if (!data || typeof data.sessions !== "object") { toast("That file is not a backup"); return; }
      Object.keys(data.sessions).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) S.sessions[k] = migrate(data.sessions[k]); });
      if (data.settings) S.settings = Object.assign(S.settings, data.settings);
      if (data.body && data.body.waist) S.body = {waist: Object.assign({}, S.body.waist, data.body.waist)};
      if (data.posture && data.posture.days) S.posture = {days: Object.assign({}, S.posture.days, data.posture.days)};
      if (S.mode === "cloud") { for (const k of Object.keys(data.sessions)) { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { try { await put("sessions/"+k, clone(S.sessions[k])); } catch(err){} } } saveSettings(); savePosture(); saveBody(); }
      else lsSave();
      render(); toast("Backup restored");
    });
    return;
  }
  if (t.dataset.act === "start" && t.value) { S.settings.start = t.value; saveSettings(); render(); keepSettingsOpen(); }
});
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.k === "w") document.querySelectorAll(".wsel button").forEach(x => x.classList.remove("on")); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.loaded && !$("#sheet").classList.contains("open")) render(); });

render();
init();
})();
</script>
